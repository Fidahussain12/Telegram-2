<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Main Cyan Glow Gradient -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Inner Glow Overlay -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Shadow Effect -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#cyanNeon)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Chat Bubble Base with Lightning 'F' cutout -->
  <g filter="url(#neonGlow)">
    <!-- Outer Speech Bubble -->
    <path d="M140 120 
             C140 120, 372 120, 372 120 
             C405 120, 432 147, 432 180 
             L432 300 
             C432 333, 405 360, 372 360 
             L250 360 
             L160 420 
             L180 360 
             L140 360 
             C107 360, 80 333, 80 300 
             L80 180 
             C80 147, 107 120, 140 120 Z" 
          fill="url(#cyanNeon)"/>

    <!-- Light Reflect Overlay -->
    <path d="M140 120 C140 120, 372 120, 372 120 C405 120, 432 147, 432 180 L432 230 C405 200, 200 200, 80 230 L80 180 C80 147, 107 120, 140 120 Z" 
          fill="url(#innerGlow)"/>

    <!-- Stylized 'F' Fast Bolt Inside Bubble -->
    <path d="M210 175 
             L315 175 
             L300 215 
             L245 215 
             L238 238 
             L290 238 
             L275 278 
             L226 278 
             L200 345 
             L165 345 Z" 
          fill="#0f172a"/>

    <!-- Online Active Indicator Pulse -->
    <circle cx="380" cy="160" r="28" fill="#22c55e" stroke="#0f172a" stroke-width="8"/>
  </g>
</svg>
